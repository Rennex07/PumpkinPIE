[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The plugin reports this through `CARGO_PKG_VERSION`, so it has to track the
# release tag. Leaving it at 0.1.0 while releases were tagged 0.2.x meant the
# provider logged itself as 0.1.0 and the marketplace would have listed 0.1.0.
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/Rennex07/PumpkinPIE"
authors = ["Rennex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pumpkin-plugin-api = "0.2.0"
tracing = "0.1"

# The published `pumpkin-plugin-api` is one Minecraft version behind this build.
# Its 46 WIT files are an older snapshot: the `0.2.0+26.3-26.51` tag adds
# `v-26-3` to player.wit, `boat-launch`/`boat-sink` to entity-statuses.wit and
# 11 lines to data-components.wit, none of which the published crate has. The
# package declaration is `package pumpkin:plugin@0.1.0` in both, so a component
# type-checks - and the one file this crate actually consumes, ipc.wit, is
# identical - but the APIs are not the same generation.
#
# So this is a real pin, not a convenience. The dependency above asks for
# `^0.2.0` and the only published version is the prerelease
# `0.1.0-dev+26.2-26.45`, which a caret requirement cannot reach anyway. Drop
# this block when upstream publishes a non-prerelease that matches the server's
# WIT, and a consumer stops needing a sibling Pumpkin checkout.
#
# `master` has drifted further from the release than the published crate has:
# commit 5746077df added a line to event.wit. That is why `release.yml` pins a
# tag rather than building against `master`.
[patch.crates-io]
pumpkin-plugin-api = { path = "../Pumpkin/crates/pumpkin-plugin-api" }

# A plugin is a component, not a native library, so the size of the artifact is
# the thing worth trading build speed for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
