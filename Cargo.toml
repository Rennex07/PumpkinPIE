[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The plugin reports this through `CARGO_PKG_VERSION`, so it has to track the
# release tag. Leaving it at 0.1.0 while releases were tagged 0.2.x meant the
# provider logged itself as 0.1.0 and the marketplace would have listed 0.1.0.
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/Rennex07/PumpkinPIE"
authors = ["Rennex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Resolved from crates.io, so a build needs no sibling Pumpkin checkout. The
# release crate `0.2.0+26.3-26.51` (published 2026-09-29) carries the same WIT
# generation as the `0.2.0+26.3-26.51` server binary on pumpkinmc.org:
# verified 2026-10-23, all 46 WIT files are byte-identical to the WIT tree of
# the Pumpkin release tag `204a94ed8`,
# `crates/pumpkin-plugin-wit@e0bb97ea48d9857c181356ba14964d47b20d0f56`.
# The version string still is not a guarantee by itself - Pumpkin kept
# `0.2.0+26.3-26.51` across a WIT change once, and fork `master` is already
# another generation (10 of 46 files match) - so the requirement is pinned
# exact rather than caret.
pumpkin-plugin-api = "=0.2.0+26.3-26.51"
tracing = "0.1"

# A plugin is a component, not a native library, so the size of the artifact is
# the thing worth trading build speed for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
