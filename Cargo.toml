[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/Rennex07/PumpkinPAPI"
authors = ["Rennex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pumpkin-plugin-api = "0.1.0-dev"
tracing = "0.1"

# A plugin is a component, not a native library, so the size of the artifact is
# the thing worth trading build speed for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
