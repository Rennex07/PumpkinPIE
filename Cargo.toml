[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The plugin reports this through `CARGO_PKG_VERSION`, so it has to track the
# release tag. Leaving it at 0.1.0 while releases were tagged 0.2.x meant the
# provider logged itself as 0.1.0 and the marketplace would have listed 0.1.0.
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/Rennex07/PumpkinPIE"
authors = ["Rennex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pumpkin-plugin-api = "0.2.0"
tracing = "0.1"

# The published `pumpkin-plugin-api` is current: its 46 WIT files are identical
# to the `0.2.0+26.3-26.51` release tag, and both declare
# `package pumpkin:plugin@0.1.0`, which is what a component's type-check keys
# off. So the dependency above can be satisfied from crates.io once upstream
# publishes a version that the `^0.2.0` requirement accepts.
#
# The patch is here because it is not published: the only version on crates.io
# is a `-dev` prerelease, `0.1.0-dev+26.2-26.45`, and a prerelease needs to be
# named exactly, so it cannot be reached by a caret requirement. Drop this block
# and the patch when upstream ships a matching non-prerelease, and a consumer
# stops needing a sibling Pumpkin checkout.
#
# Note that `master` has drifted from the release: commit 5746077df added a
# line to `event.wit`. That is why `release.yml` pins a tag rather than building
# against `master`.
[patch.crates-io]
pumpkin-plugin-api = { path = "../Pumpkin/crates/pumpkin-plugin-api" }

# A plugin is a component, not a native library, so the size of the artifact is
# the thing worth trading build speed for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
