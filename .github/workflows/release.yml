name: release

# The provider is built against the `pumpkin-plugin-api` crate from crates.io,
# which is the same crate the `0.2.0+26.3-26.51` server release carries, so a
# build needs no sibling checkout of Pumpkin and anyone can build this plugin
# without one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish as a release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  # The plugin WIT that the component is built against.
  #
  # The version string cannot be used to check this: Pumpkin kept the
  # `0.2.0+26.3-26.51` version string across a WIT change, so a server and a
  # component can both report the same version and still disagree. A mismatch
  # shows as a bare "type-checking export func 'handle-event'".
  #
  # The tree hash of crates/pumpkin-plugin-wit/v0.1 in the matching Pumpkin
  # release. This is the only thing that actually decides whether a component
  # loads.
  #
  # Bump the `pumpkin-plugin-api` requirement in the manifests and WIT_TREE
  # together. `tools/check-wit.ps1` reads the version from the requirement, so
  # there is only one place to bump the version.
  WIT_TREE: e0bb97ea48d9857c181356ba14964d47b20d0f56

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The compatibility check, made explicit. The crate is resolved from
      # crates.io, so this is what the build actually resolves.
      - name: Verify the plugin WIT matches the pinned tree
        id: wit
        shell: pwsh
        run: tools/check-wit.ps1

      - name: Install the wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PumpkinPIE -> target

      - name: Test
        run: cargo test

      - name: Build the provider and the test expansion
        run: cargo build --release --target wasm32-wasip2

      - name: Upload the two test plugins
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-pie-test-plugins
          path: |
            target/wasm32-wasip2/release/pumpkin_pie_testexp.wasm
            target/wasm32-wasip2/release/pumpkin_pie_consumer.wasm

      # The Market wants the version without a leading `v`, and the tag and the
      # release both carry one, so it is stripped once here rather than in every
      # consumer.
      #
      # `inputs.tag` takes priority because a `workflow_dispatch` run has no tag
      # ref at all: `GITHUB_REF_NAME` is the branch name, so a manual run would
      # otherwise publish a version literally called `main`. This is not
      # hypothetical - it happened, and the Market listing grew a `main` version.
      - name: Record the version
        id: version
        run: |
          $version = "${{ inputs.tag }}"
          if (-not $version) { $version = $env:GITHUB_REF_NAME }
          $version = $version -replace '^v', ''
          "value=$version" >> $env:GITHUB_OUTPUT

      # The component is attached bare rather than zipped. It is the only file
      # that ships, and a server admin's next step is to drop it into a `plugins`
      # folder, which is one click from a `.wasm` and two from a zip.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: target/wasm32-wasip2/release/pumpkin_pie_plugin.wasm
          body: |
            Download `pumpkin_pie_plugin.wasm` and drop it into your server's
            `plugins` directory.

            Built against `pumpkin-plugin-api` `${{ steps.wit.outputs.api }}` from
            crates.io, plugin WIT `${{ steps.wit.outputs.wit }}`. Verified by
            loading it in the official Windows binary from the matching Pumpkin
            release.

            **Compatibility is not by version number.** Pumpkin kept the
            `0.2.0+26.3-26.51` version string while changing its plugin WIT, so
            a server and this component can both claim the same version and
            still disagree. A mismatch shows as
            `type-checking export func 'handle-event'` and nothing else. If you
            see that, you are on a server built from a different Pumpkin commit
            than the one above.
          fail_on_unmatched_files: true

      # The Market listing, updated from the same file that just became the
      # release. `plugin-id` is the listing's public ID, which is used instead of
      # `plugin-name` because the listing's name is `PumpkinPIE  | Placeholders
      # for all` - two spaces and a pipe - and a name match would break on an
      # edit nobody notices.
      #
      # Needs `MARKET_API_TOKEN` in the repository secrets, scoped
      # `plugins:update` and `plugins:versions:upload`. Without it the step fails,
      # which is deliberate: a release that silently skips the Market is a release
      # nobody can find.
      - name: Publish to the Pumpkin Market
        uses: filiphsps/pumpkin-plugins/actions/publish-to-pumpkin-market@publish-to-pumpkin-market-v0.0.4
        with:
          plugin-id: TV3Ord4H
          version: ${{ steps.version.outputs.value }}
          wasm-file: target/wasm32-wasip2/release/pumpkin_pie_plugin.wasm
          api-token: ${{ secrets.MARKET_API_TOKEN }}
          track: stable
          release-notes: |
            Built against `pumpkin-plugin-api` `${{ steps.wit.outputs.api }}` from
            crates.io, plugin WIT `${{ steps.wit.outputs.wit }}`.

            Fixes `set_placeholders_batch` sending a line over 32 KiB, which the
            provider dropped and returned a shorter results array for, so every
            line after it read its neighbour's answer. The batch is refused whole
            instead.
