name: release

# The provider has to be built against a `pumpkin-plugin-api` whose WIT matches
# the server that will load it, and the published crate is behind the server. So
# this workflow builds against a checkout of Pumpkin placed as a sibling of the
# workspace, which is what the `[patch.crates-io]` in the root `Cargo.toml`
# points at.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish as a release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  # The Pumpkin revision whose `pumpkin-plugin-api` this was last verified
  # against. Bump it deliberately: a component built against a different WIT
  # fails to load with "type-checking export func `handle-event`", so this is
  # the one input that decides whether a release works.
  PUMPKIN_REPO: PumpkinMC/Pumpkin
  PUMPKIN_REF: main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Sibling of the workspace, so `../Pumpkin` resolves.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PUMPKIN_REPO }}
          ref: ${{ env.PUMPKIN_REF }}
          path: Pumpkin

      - name: Install the wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PumpkinPAPI -> target

      - name: Test
        run: cargo test

      - name: Build the provider and the test expansion
        run: cargo build --release --target wasm32-wasip2

      - name: Upload the test expansion
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-papi-testexp
          path: target/wasm32-wasip2/release/pumpkin_papi_testexp.wasm

      - name: Package the provider
        run: Compress-Archive -Path target\wasm32-wasip2\release\pumpkin_papi_plugin.wasm -DestinationPath pumpkin-papi-${{ inputs.tag || github.ref_name }}.zip

      # Recorded before the release body needs it.
      - name: Record the Pumpkin revision
        id: pumpkin
        run: |
          git -C Pumpkin rev-parse HEAD | Out-File -FilePath pumpkin-sha.txt
          "sha=$(git -C Pumpkin rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: pumpkin-papi-${{ inputs.tag || github.ref_name }}.zip
          body: |
            Drop `pumpkin_papi_plugin.wasm` into your server's `plugins/`
            directory alongside the Pumpkin build it was compiled against.

            Built against `${{ env.PUMPKIN_REPO }}@${{ env.PUMPKIN_REF }}` at
            `${{ steps.pumpkin.outputs.sha }}`. A component built against a
            different `pumpkin-plugin-api` WIT fails to load, so use a release
            matching your server.
          fail_on_unmatched_files: true
